version: 2
updates:
  # Every plugin folder (and tests/ inside it) with a requirements*.txt.
  # The glob also covers plugins added later.
  - package-ecosystem: pip
    directories:
      - "/**/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]

  # Keeps SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
