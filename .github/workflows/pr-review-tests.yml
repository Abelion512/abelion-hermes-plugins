name: pr-review-tests

on:
  pull_request:
    paths:
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # unprivileged job, no secrets
      - name: Run mocked unit tests (no network, no key)
        run: python3 .github/scripts/test_pr_review.py
