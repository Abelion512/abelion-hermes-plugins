# Applied by .github/workflows/labeler.yml. Labels follow plugin ownership.
screen:
  - changed-files:
      - any-glob-to-any-file: "plugins/screen/**"
pii-mask:
  - changed-files:
      - any-glob-to-any-file: "plugins/pii_mask_abelion/**"
ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/dependabot.yml"
          - "plugins/**/requirements*.txt"
          - "plugins/**/plugin-requirements.txt"
audit:
  - changed-files:
      - any-glob-to-any-file: "plugins/pii_mask_abelion/validation/**"
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/plugin-docs-standard.md"
          - "plugins/**/docs/**"
          - "plugins/**/README.md"
          - "plugins/**/e2e/README.md"
          - "README.md"
