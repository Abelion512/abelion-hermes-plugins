# Priority labels. Risk labels are based on changed files; the reviewer bot
# may add/escalate labels from its advisory review. Labels never approve a PR.
P0:
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/nebula/guard.py"
          - "plugins/nebula/pii_middleware.py"
          - "plugins/nebula/output_redact.py"
          - "plugins/nebula/_credentials.py"
          - "plugins/nebula/_patterns.py"
P1:
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/**/plugin.yaml"
          - "plugins/**/plugin.py"
          - "plugins/**/main*.py"
          - "hermes.json"
P2:
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/**/tests/**"
          - "plugins/**/e2e/**"
          - "tests/**"
P3:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/scripts/**"
P4:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**.md"

# Applied by .github/workflows/labeler.yml.
# Shared labels only; plugin-specific ownership labels live in plugins/<id>/.github/labels.yml.

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/dependabot.yml"
          - "plugins/**/requirements*.txt"
          - "plugins/**/plugin-requirements.txt"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/plugin-docs-standard.md"
          - ".github/task-templates/**"
          - "plugins/**/docs/**"
          - "plugins/**/README.md"
          - "plugins/**/e2e/README.md"
          - "README.md"

repo-tools:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/task-templates/**"
          - ".github/triage-priority.md"
          - ".github/labeler.yml"
          - ".github/plugin-docs-standard.md"
          - ".github/dependabot.yml"
          - ".plugins/**"

security-audit:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/e2e_support/**"
          - "plugins/nebula/validation/**"
