name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly (Mon 02:00 UTC): a new CVE in an unchanged dependency is still caught.
    - cron: "0 2 * * 1"

# Least privilege: read-only checkout, no packages/id-token/deploy scopes.
permissions:
  contents: read

jobs:
  # Finds every plugin folder (any dir with a plugin.yaml). Runs only the plugins
  # touched by the change. A change outside any plugin folder (shared files such as
  # workflows, hermes.json, root tests), a schedule or a manual run checks all of them.
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.find.outputs.plugins }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          all=$(find . -name plugin.yaml -not -path './.git/*' -printf '%h\n' | sed 's|^\./||' | sort)
          base=""
          [ "$EVENT" = pull_request ] && base="$PR_BASE"
          [ "$EVENT" = push ] && base="$PUSH_BEFORE"
          changed=""
          if [ -n "$base" ] && ! echo "$base" | grep -qE '^0+$'; then
            changed=$(git diff --name-only "$base" HEAD 2>/dev/null) || base=""
          else
            base=""
          fi
          if [ -z "$base" ]; then
            sel="$all"
          else
            sel=""
            shared=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              hit=""
              for d in $all; do
                case "$f" in "$d"/*) hit="$d"; break;; esac
              done
              if [ -n "$hit" ]; then sel="$sel$hit"$'\n'; else shared=1; fi
            done <<< "$changed"
            [ "$shared" = 1 ] && sel="$all"
          fi
          json=$(printf '%s\n' "$sel" | sed '/^$/d' | sort -u | jq -R . | jq -sc .)
          echo "plugins=$json" | tee -a "$GITHUB_OUTPUT"

  # Strict pre-merge credential guard: a PR that introduces a leaked secret, a
  # missing plugin manifest, or a bare provider-supplied key shape must not
  # become mergeable through labeling or review alone.
  credential-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: fail on obvious credential shapes in PR diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY' || exit 7
          import os, sys, re, subprocess

          base = os.environ.get("PR_BASE", "").strip()
          if not base or re.fullmatch(r"0+", base):
              print("::warning::credential-guard: no meaningful base; skipping diff check")
              sys.exit(0)

          diff = subprocess.check_output(["git", "diff", "--unified=0", f"{base}..HEAD"], text=True)
          print("diff_bytes=%d" % len(diff.encode("utf-8")))
          # Guard scans its own PR diff; constants are split so these lines never self-match.
          pin = "9a85916c" + "87d56c2ca00b02" + "fad8918f93ef1816e9"
          canary = "ghp" + "_Ab1Cd2Ef3Gh4Ij5Kl6Mn7Op8Qr9St0Uv1Wx2"
          suspicious = []
          for line in diff.splitlines():
              # Only added lines are leak candidates; removals and diff headers false-positive.
              if not line.startswith("+") or line.startswith("+++"): continue
              if pin in line or canary in line: continue
              if re.match(r"^\+[0-9a-f]{40}:", line): continue
              if "uses:" in line and re.search(r"@[0-9a-f]{40}", line): continue
              low = line.lower()
              if re.search(r'(?<![A-Za-z0-9])[A-Za-z0-9+/]{40}(?![A-Za-z0-9+/=])', line):
                  suspicious.append(("long_base64_like", line[:120]))
              if re.search(r'(?<![A-Za-z0-9])[0-9a-f]{32,}(?![A-Za-z0-9])', low):
                  suspicious.append(("long_hex_like", line[:120]))
              if re.search(r'sk-(?:prod|pro|proj|live|test)-[A-Za-z0-9_\-]{20,}', low):
                  suspicious.append(("openai_key_shape", line[:120]))
              if re.search(r'aiza[0-9A-Za-z_\-]{30,}', low):
                  suspicious.append(("google_key_shape", line[:120]))
              if re.search(r'gh[pousr]_[A-Za-z0-9_\-]{20,}', low):
                  suspicious.append(("github_token_shape", line[:120]))
              if re.search(r'xox[bpsr]-[A-Za-z0-9_\-]{10,}', low):
                  suspicious.append(("slack_token_shape", line[:120]))
              if re.search(r'hf_[A-Za-z0-9_\-]{20,}', low):
                  suspicious.append(("huggingface_token_shape", line[:120]))
              if re.search(r'akia[0-9A-Z]{16}', low):
                  suspicious.append(("aws_key_shape", line[:120]))
          if suspicious:
              print("::error::possible credential leak in PR diff")
              for kind, hint in suspicious[:20]:
                  print(f"::error::  {kind}: {hint}")
              sys.exit(7)
          print("credential-guard: no obvious secret shape in diff")
      - name: warn on naked env files in changed tree
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD 2>/dev/null || true)
          else
            CHANGED=""
          fi
          if [ -n "$CHANGED" ]; then
            for f in $CHANGED; do
              case "$f" in
                *.env|*.env.*|*.env.sample|*.env.template|*.env.local)
                  echo "::warning::potential env file in diff: $f"
                  ;;
              esac
            done
          fi

  plugin:
    needs: detect
    if: needs.detect.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.1.0 (3.14 matches the pinned Hermes managed env)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: install test deps and pip-audit
        env:
          P: ${{ matrix.plugin }}
        run: |
          python -m pip install pip-audit pytest
          for f in "$P"/tests/requirements*.txt; do
            [ -f "$f" ] && python -m pip install -r "$f"
          done
          true
      - name: syntax check
        env:
          P: ${{ matrix.plugin }}
        run: |
          python -m compileall -q "$P"
      - name: tests
        env:
          P: ${{ matrix.plugin }}
        run: |
          if [ -d "$P/tests" ]; then
            python -m pytest "$P/tests" -q --junitxml="$RUNNER_TEMP/${P##*/}-tests.xml"
          else
            echo "::notice title=$P::no tests in this plugin yet (syntax check only)"
          fi
      - name: Unit test summary
        if: always()
        env:
          P: ${{ matrix.plugin }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          plugin = os.environ["P"]
          report = Path(os.environ["RUNNER_TEMP"]) / (plugin.rsplit("/", 1)[-1] + "-tests.xml")
          if not report.is_file():
              line = f"- {plugin}: JUnit report unavailable; inspect the test step log."
          else:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              counts = {name: sum(int(suite.attrib.get(name, 0)) for suite in suites)
                        for name in ("tests", "failures", "errors", "skipped")}
              line = (f"- **{plugin}**: {counts['tests']} tests, "
                      f"{counts['failures']} failures, {counts['errors']} errors, "
                      f"{counts['skipped']} skipped.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
          PY
      - name: dependency audit
        env:
          P: ${{ matrix.plugin }}
        run: |
          found=0
          while IFS= read -r f; do
            found=1
            echo "pip-audit $f"
            pip-audit -r "$f"
          done < <(find "$P" -name 'requirements*.txt' -o -name 'plugin-requirements.txt' | sort -u)
          [ "$found" = 1 ] || echo "no requirements files in $P"

  # Real host E2E: never silently skip host-dependent tests. Pin the exact
  # required-privacy core revision, verify the imported source matches it, and
  # use only a synthetic loopback provider plus disposable profiles.
  e2e:
    name: Real Hermes E2E (pinned core, Privacy Guard)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REQUIRE_HERMES_E2E: "1"
      HERMES_EXPECTED_COMMIT: 9a85916c87d56c2ca00b02fad8918f93ef1816e9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout the exact required-privacy Hermes core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Abelion512/hermes-4gent
          ref: 9a85916c87d56c2ca00b02fad8918f93ef1816e9
          path: hermes-core
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      # Node 26 satisfies Hermes' declared runtime range; pin the action to its reviewed commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
      - name: Install host dependencies for E2E
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tigervnc-standalone-server xdotool xfce4-panel xfwm4 xfdesktop4 xfce4-settings xfce4-terminal dbus-x11 x11-xserver-utils x11-utils x11-xkb-utils xauth fonts-dejavu-core
          if ! command -v Xvnc >/dev/null 2>&1; then
            xvnc="$(command -v Xtigervnc || true)"
            test -n "$xvnc" || { echo "Neither Xvnc nor Xtigervnc is available"; exit 1; }
            sudo ln -s "$xvnc" /usr/local/bin/Xvnc
          fi
          command -v Xvnc
          command -v xdotool
          command -v xfce4-terminal
          command -v xfwm4
          command -v xfce4-panel
          command -v xfdesktop
          command -v xfsettingsd
          command -v xdpyinfo
          command -v xprop
      - name: Install pinned Hermes source and E2E dependencies
        run: |
          python -m pip install --upgrade pip
          # Use Hermes' own uv resolver so its [tool.uv] Pillow 13 override is honored.
          # pip install -e fails here: browser-harness 0.1.13 pins Pillow 12.3.0.
          python -m pip install uv==0.13.5
          uv sync --project ./hermes-core --no-dev
          uv pip install --python "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" pytest==9.1.1
          # The real-host harness copies plugin directories directly into a disposable profile,
          # bypassing Hermes' normal plugin installer. Install declared dependencies for active
          # catalog plugins into the same pinned Hermes environment before loading their APIs.
          "$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          import hermes_yaml as yaml

          root = Path(os.environ["GITHUB_WORKSPACE"])
          catalog = json.loads((root / "hermes.json").read_text(encoding="utf-8"))
          dependencies = []
          for plugin in catalog.get("plugins", []):
              path = root / plugin["path"] / "plugin.yaml"
              if not path.is_file():
                  continue
              with path.open(encoding="utf-8") as handle:
                  manifest = yaml.safe_load(handle) or {}
              declared = manifest.get("python_dependencies", [])
              if not isinstance(declared, list) or not all(isinstance(item, str) and item.strip() for item in declared):
                  raise SystemExit(f"Invalid python_dependencies in {path}")
              dependencies.extend(declared)
          dependencies = list(dict.fromkeys(dependencies))
          if dependencies:
              subprocess.run(["uv", "pip", "install", "--python", sys.executable, *dependencies], check=True)
          PY
          echo "HERMES_PYTHON=$GITHUB_WORKSPACE/hermes-core/.venv/bin/python" >> "$GITHUB_ENV"
          # Dashboard's --skip-build mode requires the matching, fresh web_dist in Hermes core.
          (cd hermes-core && npm install --workspace web && npm run build -w web)
          # Use the exact Chrome for Testing build paired with Puppeteer 24.31.0.
          # Install puppeteer-core only; browser download/install scripts are not needed.
          E2E_NODE="$RUNNER_TEMP/e2e-node"
          mkdir -p "$E2E_NODE"
          printf '%s' '{"private":true,"name":"hermes-plugin-e2e-tools"}' > "$E2E_NODE/package.json"
          npm install --prefix "$E2E_NODE" --no-audit --no-fund puppeteer-core@24.31.0
          CHROME_FOR_TESTING_VERSION="142.0.7444.175"
          CHROME_ZIP="$RUNNER_TEMP/chrome-for-testing-${CHROME_FOR_TESTING_VERSION}.zip"
          CHROME_ROOT="$RUNNER_TEMP/chrome-for-testing-${CHROME_FOR_TESTING_VERSION}"
          curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64/chrome-linux64.zip" -o "$CHROME_ZIP"
          rm -rf "$CHROME_ROOT"
          mkdir -p "$CHROME_ROOT"
          unzip -q "$CHROME_ZIP" -d "$CHROME_ROOT"
          chrome="$CHROME_ROOT/chrome-linux64/chrome"
          test -x "$chrome"
          export NODE_PATH="$E2E_NODE/node_modules"
          node -e "require('puppeteer-core')"
          echo "NODE_PATH=$E2E_NODE/node_modules" >> "$GITHUB_ENV"
      - name: Verify exact host revision
        run: |
          actual="$(git -C hermes-core rev-parse HEAD)"
          test "$actual" = "$HERMES_EXPECTED_COMMIT"
          "$HERMES_PYTHON" - <<'PY'
          import os, subprocess
          expected = os.environ["HERMES_EXPECTED_COMMIT"]
          import hermes_cli
          source_root = os.path.dirname(os.path.dirname(hermes_cli.__file__))
          actual = subprocess.check_output(["git", "-C", source_root, "rev-parse", "HEAD"], text=True).strip()
          print(f"Hermes import source: {source_root}")
          print(f"Hermes core HEAD: {actual}")
          assert actual == expected, f"imported Hermes source mismatch: {actual} != {expected}"
          from hermes_cli.observability.shared_metrics_consent import OFFER_VERSION
          print(f"Hermes host probe: OFFER_VERSION={OFFER_VERSION}")
          PY
          node -e "require('puppeteer-core')"
      - name: Run all real-host end-to-end tests
        run: |
          "$HERMES_PYTHON" -m pytest plugins/*/e2e -q -rs --junitxml="$RUNNER_TEMP/real-host-e2e.xml"
      - name: Real-host E2E summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "real-host-e2e.xml"
          if not report.is_file():
              line = "- Real-host E2E: JUnit report unavailable; inspect the E2E step log."
          else:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              counts = {name: sum(int(suite.attrib.get(name, 0)) for suite in suites)
                        for name in ("tests", "failures", "errors", "skipped")}
              line = (f"- **Real-host E2E**: {counts['tests']} tests, "
                      f"{counts['failures']} failures, {counts['errors']} errors, "
                      f"{counts['skipped']} skipped.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # full history: a leaked secret in an old commit still counts
      - name: gitleaks (pinned version + verified checksum, no third-party action)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # Release/PR checks scan every commit reachable from the checked-out
          # candidate, not unrelated fetched audit branches. Keep repository-wide
          # monitoring on schedules and explicit manual runs.
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            ./gitleaks git --redact --verbose .
          else
            ./gitleaks git --redact --verbose --log-opts="--full-history HEAD --diff-filter=tuxdb" .
          fi

  # Repo-wide doc and manifest hygiene. A new plugin should not land with a
  # broken skill frontmatter, missing docs trio, or inconsistent status claim.
  doc-and-manifest-lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: lint plugin manifests and skill frontmatter
        run: |
          python - <<'PY'
          import json, re, sys, yaml
          from pathlib import Path

          root = Path(".")
          catalog = json.loads((root / "hermes.json").read_text(encoding="utf-8"))
          plugin_ids = {p["path"].split("/")[-1] for p in catalog.get("plugins", []) if isinstance(p.get("path"), str)}
          name_re = re.compile(r"^[a-zA-Z0-9][a-zA-Z0-9_-]*$")
          desc_re = re.compile(r"^.{1,60}\.$")
          problems = []

          for path in root.glob("plugins/*/plugin.yaml"):
              pid = path.parent.name
              try:
                  manifest = yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  problems.append((str(path), f"manifest unreadable: {exc}"))
                  continue
              if not isinstance(manifest, dict):
                  problems.append((str(path), "manifest must be a mapping"))
                  continue
              if pid not in plugin_ids:
                  problems.append((str(path), "plugin folder has no catalog entry in hermes.json"))

          for path in sorted(root.glob("plugins/*/skills/*/SKILL.md")):
              raw = path.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", raw, re.S)
              if not m:
                  problems.append((str(path), "skill missing YAML frontmatter"))
                  continue
              try:
                  fm = yaml.safe_load(m.group(1))
              except Exception as exc:
                  problems.append((str(path), f"skill frontmatter parse error: {exc}"))
                  continue
              if not isinstance(fm, dict):
                  problems.append((str(path), "skill frontmatter must be a mapping"))
                  continue
              if not name_re.match(str(fm.get("name") or "")):
                  problems.append((str(path), f"skill name invalid or missing: {fm.get('name')!r}"))
              desc = fm.get("description")
              if not isinstance(desc, str) or not desc_re.match(desc):
                  problems.append((str(path), f"skill description invalid: {desc!r}"))

          if problems:
              print("::error::plugin manifest or skill lint failures")
              for p, reason in problems:
                  print(f"::error::  {p}: {reason}")
              sys.exit(6)
          print("plugin manifests and skills pass lint")
      - name: warn on plugin folders missing docs trio
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          root = Path(".")
          missing = []
          for plugin_dir in sorted(root.glob("plugins/*")):
              if not (plugin_dir / "plugin.yaml").is_file():
                  continue
              needed = [
                  plugin_dir / "README.md",
                  plugin_dir / "docs" / "USAGE.md",
                  plugin_dir / "skills",
              ]
              miss = [str(p.relative_to(root)) for p in needed if not p.exists()]
              if miss:
                  missing.append(f"{plugin_dir.name}: {', '.join(miss)}")
          if missing:
              print("::warning::plugin docs trio incomplete")
              for line in missing:
                  print(f"::warning::  {line}")
          else:
              print("all catalog plugins present the docs trio")
          PY
