name: ci

on:
  push:
  pull_request:

# Least privilege: read-only checkout, no packages/id-token/deploy scopes.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.1.0 (3.14 matches the pinned Hermes managed env)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: python -m pip install -r screen/tests/requirements-test.txt
      - run: python -m pytest screen/tests -q

  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: python -m pip install pip-audit
      # Audits the plugin's declared Python deps (mirror of plugin.yaml).
      - run: pip-audit -r screen/plugin-requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # full history: a leaked secret in an old commit still counts
      - name: gitleaks (pinned version + verified checksum, no third-party action)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
