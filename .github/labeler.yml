# Plugin registration: catalog entry or plugin manifest added/changed.
# A new plugin registers by adding plugins/<id>/ plus a hermes.json entry;
# this labels those PRs without hardcoding each plugin.
plugin-registry:
  - changed-files:
      - any-glob-to-any-file:
          - "hermes.json"
          - "plugins/*/plugin.yaml"

# Applied by .github/workflows/labeler.yml.
# Shared labels only; plugin-specific ownership labels live in plugins/<id>/.github/labels.yml.

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/dependabot.yml"
          - "plugins/**/requirements*.txt"
          - "plugins/**/plugin-requirements.txt"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/plugin-docs-standard.md"
          - ".github/task-templates/**"
          - "plugins/**/docs/**"
          - "plugins/**/README.md"
          - "plugins/**/e2e/README.md"
          - "README.md"

repo-tools:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/task-templates/**"
          - ".github/triage-priority.md"
          - ".github/labeler.yml"
          - ".github/plugin-docs-standard.md"
          - ".github/dependabot.yml"
          - ".plugins/**"

security-audit:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/e2e_support/**"
          - "plugins/**/validation/**"
