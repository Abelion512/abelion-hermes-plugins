name: labeler

# pull_request_target runs the workflow file from the base branch with write access.
# Safe here because nothing from the PR is checked out or executed: labeler only
# reads changed file names and the label config from the base branch.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    # Dependabot PRs get a read-only token here; their labels are set in dependabot.yml.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # add labels to the PR
      issues: write         # create labels that do not exist yet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            .github
            plugins
            hermes.json
      - name: merge plugin-local labels
        run: |
          python - <<'PY'
          import os, glob, yaml, json, sys

          repo = {} 
          repo_path = os.path.join(os.getcwd(), ".github", "labeler.yml")
          if os.path.exists(repo_path):
              with open(repo_path, encoding="utf-8") as f:
                  repo = yaml.safe_load(f) or {}

          combined = dict(repo)
          for path in sorted(glob.glob("plugins/*/.github/labels.yml")):
              with open(path, encoding="utf-8") as f:
                  plugin = yaml.safe_load(f) or {}
              for key, rule in plugin.items():
                  if key in combined:
                      print(f"warn: plugin label {key!r} from {path} conflicts with existing label; skipping", file=sys.stderr)
                  else:
                      # Labeler v7 matches repo-root-relative paths; plugin-local
                      # files document globs as plugin-relative -- prefix them.
                      prefix = os.path.dirname(os.path.dirname(path)).replace("\\", "/")
                      rule = json.loads(json.dumps(rule))  # deep copy
                      for sec in (rule if isinstance(rule, list) else [rule]):
                          if not isinstance(sec, dict):
                              continue
                          for cf in sec.get("changed-files", []):
                              if not isinstance(cf, dict):
                                  continue
                              gk = "any-glob-to-any-file"
                              if gk in cf:
                                  globs = cf[gk] if isinstance(cf[gk], list) else [cf[gk]]
                                  cf[gk] = [g if g.startswith(prefix + "/") else f"{prefix}/{g}" for g in globs]
                      combined[key] = rule

          with open("merged_labeler.yml", "w", encoding="utf-8") as f:
              yaml.safe_dump(combined, f, sort_keys=False)
          # GITHUB_OUTPUT is a file path: open it, do not pass the string as print(file=...).
          out = os.environ.get("GITHUB_OUTPUT")
          stream = open(out, "a", encoding="utf-8") if out else sys.stdout
          try:
              print("merged_labeler_path=merged_labeler.yml", file=stream)
              print("labels_count=%d" % len(combined), file=stream)
          finally:
              if out:
                  stream.close()
          PY
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: merged_labeler.yml
          sync-labels: true
